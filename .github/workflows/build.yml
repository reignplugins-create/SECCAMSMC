name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ForgeGradle 5 needs Gradle 7.x, so we pin it here instead of committing a wrapper.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: securitycams-jar
          path: build/libs/*.jar

      # Tag a version (git tag v1.0.0 && git push --tags) to also get a permanent Release download.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
